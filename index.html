    <!-- Queue measurement immediately, load Google shortly after first paint, and keep OpenAI deferred. -->
    <script>
      (function (w, d) {
        w.dataLayer = w.dataLayer || [];
        w.gtag = w.gtag || function () {
          w.dataLayer.push(arguments);
        };
        w.gtag('js', new Date());
        w.gtag('config', 'G-4V8DJ7PLL4');
        w.gtag('config', 'AW-16857032468');

        if (!w.oaiq) {
          var queue = function () { queue.q.push(arguments); };
          queue.q = [];
          w.oaiq = queue;
        }
        w.oaiq('init', { pixelId: 'PcrTm4fXeUhp2MuuNkHxUB' });

        var googleLoaded = false;
        var openAiLoaded = false;

        function loadGoogleMeasurement() {
          if (googleLoaded) return;
          googleLoaded = true;
          var google = d.createElement('script');
          google.async = true;
          google.src = 'https://www.googletagmanager.com/gtag/js?id=G-4V8DJ7PLL4';
          d.head.appendChild(google);
        }

        function loadOpenAiMeasurement() {
          if (openAiLoaded) return;
          openAiLoaded = true;
          var openai = d.createElement('script');
          openai.async = true;
          openai.src = 'https://bzrcdn.openai.com/sdk/oaiq.min.js';
          d.head.appendChild(openai);
        }

        function loadOnIntent() {
          loadGoogleMeasurement();
          loadOpenAiMeasurement();
        }

        ['pointerdown', 'keydown', 'touchstart'].forEach(function (eventName) {
          w.addEventListener(eventName, loadOnIntent, { once: true, passive: true });
        });

        d.addEventListener('DOMContentLoaded', function () {
          w.requestAnimationFrame(function () {
            w.requestAnimationFrame(function () {
              w.setTimeout(loadGoogleMeasurement, 300);
            });
          });
        }, { once: true });

        w.addEventListener('load', function () {
          if ('requestIdleCallback' in w) {
            w.requestIdleCallback(loadOpenAiMeasurement, { timeout: 2500 });
          } else {
            w.setTimeout(loadOpenAiMeasurement, 1800);
          }
        }, { once: true });
      })(window, document);
    </script>
